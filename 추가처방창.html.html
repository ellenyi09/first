<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>추가처방 조회 EMR</title>
    <style>
        /* 기본 리셋 및 폰트 설정 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Malgun Gothic', '맑은 고딕', dotum, sans-serif; font-size: 12px; background-color: #f4f4f4; color: #333; }
        
        /* 전체 컨테이너 */
        .emr-container { width: 100%; max-width: 1400px; margin: 0 auto; border: 1px solid #999; background-color: #fff; display: flex; flex-direction: column; height: 100vh; }

        /* 상단 타이틀 바 (갈색) */
        .title-bar { background-color: #a3493b; color: #fff; padding: 5px 10px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .title-bar .icons { cursor: pointer; }

        /* 환자 정보 바 */
        .patient-info-bar { background-color: #eef2f5; padding: 5px 10px; border-bottom: 1px solid #ccc; display: flex; align-items: center; gap: 10px; }
        .info-group { display: flex; align-items: center; }
        .info-label { background-color: #f9f9f9; border: 1px solid #ccc; padding: 2px 5px; border-right: none; color: #555; }
        .info-value { background-color: #fff; border: 1px solid #ccc; padding: 2px 8px; min-width: 80px; font-weight: bold; }
        .btn-search { margin-left: auto; background-color: #5b8c9a; color: white; border: 1px solid #4a7582; padding: 3px 15px; cursor: pointer; font-weight: bold; }

        /* 필터 및 액션 바 */
        .filter-bar { background-color: #fff; padding: 5px 10px; border-bottom: 1px solid #ccc; display: flex; align-items: center; gap: 10px; }
        .filter-bar input[type="date"] { border: 1px solid #ccc; padding: 2px; }
        .record-count { color: #555; margin-left: 10px; }
        .btn-action { margin-left: auto; border: 1px solid #ccc; background-color: #fff; padding: 2px 10px; cursor: pointer; }

        /* 테이블 영역 */
        .table-container { flex-grow: 1; overflow: auto; background-color: #fff; }
        table { width: 100%; border-collapse: collapse; min-width: 1200px; table-layout: fixed; }
        th, td { border: 1px solid #d4d4d4; padding: 4px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        th { background-color: #f7f7f7; font-weight: normal; color: #333; position: sticky; top: 0; box-shadow: 0 1px 0 #d4d4d4; }
        td { height: 24px; }
        
        /* 특정 열 너비 지정 */
        .col-title { width: 120px; text-align: left; padding-left: 5px; }
        .col-name { width: 250px; text-align: left; padding-left: 5px; }
        .col-details { width: 100px; }
        
        /* 발생구분 파란색 X 표시 흉내 */
        .crossed-out { position: relative; display: inline-block; }
        .crossed-out::after { content: 'X'; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: blue; font-size: 16px; font-weight: bold; opacity: 0.7; }

        /* 하단 특기사항 영역 */
        .footer-note { height: 60px; border-top: 2px solid #ccc; background-color: #f9f9f9; display: flex; align-items: stretch; }
        .note-label { width: 100px; background-color: #f4f4f4; border-right: 1px solid #ccc; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #555; }
        .note-content { flex-grow: 1; padding: 10px; background-color: #fff; }
    </style>
</head>
<body>

<div class="emr-container">
    <!-- 타이틀 바 -->
    <div class="title-bar">
        <span>(12345678 김이화 여/55y) 추가처방 조회 </span>
        <span class="icons">⚙ ☆ ≡ ✕</span>
    </div>

    <!-- 환자 정보 바 -->
    <div class="patient-info-bar">
        <div class="info-group">
            <span class="info-label">병원등록번호</span>
            <span class="info-value">12345678</span>
        </div>
        <div class="info-value">김이화</div>
        <div class="info-value">여/55y</div>
        <div class="info-value">113병동 07병실</div>
        <button class="btn-search">조회</button>
    </div>

    <!-- 필터 바 -->
    <div class="filter-bar">
        <div class="info-group">
            <span class="info-label" style="border:none; background:none;">처방일자</span>
            <input type="date" value="2026-07-09">
        </div>
        <label><input type="checkbox"> 전체</label>
        <span class="record-count">(추가처방 RecordCount = 1 건 조회)</span>
        <select class="btn-action">
            <option>Action</option>
        </select>
    </div>

    <!-- 처방 테이블 -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="col-title">타이틀</th>
                    <th>특기</th>
                    <th>처방구분</th>
                    <th>발생<br>구분</th>
                    <th>Ty<br>pe</th>
                    <th>조제<br>구분</th>
                    <th>처방코드</th>
                    <th class="col-name">처방명</th>
                    <th>지속</th>
                    <th>투여량</th>
                    <th>단위</th>
                    <th>방법</th>
                    <th>간격</th>
                    <th class="col-details">투여방법내용</th>
                    <th>속도</th>
                    <th>속도단위</th>
                    <th>MIX</th>
                    <th>횟수</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="col-title">Routine Order</td>
                    <td></td>
                    <td>약주사</td>
                    <td></td>
                    <td></td>
                    <td>N</td>
                    <td>XB-JNS1L</td>
                    <td class="col-name">Normal saline inj (JW) [1000ml]</td>
                    <td>C</td>
                    <td>1</td>
                    <td>BAG</td>
                    <td>IVF</td>
                    <td>PH</td>
                    <td class="col-details">1일 2회, ...</td>
                    <td>80</td>
                    <td></td>
                    <td></td>
                    <td>2</td>
                </tr>
                <!-- 빈 줄 추가 (UI 공간 채우기 용도) -->
                <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
            </tbody>
        </table>
    </div>

    <!-- 하단 특기사항 -->
    <div class="footer-note">
        <div class="note-label">특기사항</div>
        <div class="note-content"></div>
    </div>
</div>

</body>
</html>
